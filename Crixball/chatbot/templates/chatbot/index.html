{% extends 'header.html' %}

{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        /* Estilo general */
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        #chatbox {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            max-width: 450px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin: 20px 0;
            padding-top: 10px;
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .user-message {
            background-color: #4CAF50;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .bot-message {
            background-color: #e3e3e3;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        /* Añadir flechas en los mensajes */
        .user-message::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #4CAF50;
            transform: translateY(-50%);
        }

        .bot-message::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #e3e3e3;
            transform: translateY(-50%);
        }

        /* Animación para "escribiendo..." */
        .typing {
            font-style: italic;
            color: #888;
            display: inline-block;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1s infinite;
        }

        @keyframes typing {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Estilo para el área de entrada */
        .input-area {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            border-top: 1px solid #ddd;
        }

        #userMessage {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background-color: #fff;
        }

        button {
            width: 15%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            background-color: #388e3c;
        }

        /* Estilos responsive */
        @media (max-width: 600px) {
            #chatbox {
                width: 100%;
                padding: 10px;
                border-radius: 0;
            }

            #userMessage {
                width: 70%;
            }

            button {
                width: 20%;
            }
        }
    </style>
</head>
<body>

    <div id="chatbox">
        <h2>Chat con nuestro asistente</h2>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="userMessage" placeholder="Escribe tu mensaje aquí...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

<script>
    async function sendMessage() {
        const userMessage = document.getElementById("userMessage").value;
        if (!userMessage) {
            alert("Por favor, escribe un mensaje.");
            return;
        }
        const csrfToken = "{{ csrf_token }}";

        // Muestra el mensaje del usuario en el chat
        const messagesDiv = document.getElementById("messages");
        messagesDiv.innerHTML += `<div class="message-bubble user-message"><strong>Tú:</strong> ${userMessage}</div>`;

        // Muestra la animación de "escribiendo..."
        const botTypingDiv = document.createElement("div");
        botTypingDiv.innerHTML = `<div class="typing">Bot está escribiendo <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
        messagesDiv.appendChild(botTypingDiv);

        // Verificar si el usuario está al final del chat
        const atBottom = (messagesDiv.scrollHeight - messagesDiv.scrollTop === messagesDiv.clientHeight);

        // Envía el mensaje al backend
        const response = await fetch("{% url 'dialogflow_chat' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken,
            },
            body: JSON.stringify({ message: userMessage }),
        });

        const data = await response.json();

        // Remueve la animación de "escribiendo..." y muestra la respuesta
        setTimeout(() => {
            botTypingDiv.remove();
            if (data.response) {
                messagesDiv.innerHTML += `<div class="message-bubble bot-message"><strong>Bot:</strong> ${data.response}</div>`;
            } else {
                messagesDiv.innerHTML += `<div class="message-bubble bot-message"><strong>Error:</strong> ${data.error}</div>`;
            }

            // Desplazar solo si el usuario estaba al final del chat antes de la respuesta
            if (atBottom) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }, 2000); // Simula el tiempo de escritura

        document.getElementById("userMessage").value = "";
    }
</script>

</body>
</html>

{% include 'footer.html' %}
{% endblock %}
